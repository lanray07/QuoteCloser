name: iOS App Store Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build and upload QuoteCloser
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT_PATH: QuoteCloser.xcodeproj
      SCHEME: QuoteCloser
      CONFIGURATION: Release
      ARCHIVE_PATH: build/QuoteCloser.xcarchive
      EXPORT_PATH: build/QuoteCloserExport
      BUNDLE_IDENTIFIER: com.quotecloser.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 || secrets.ASC_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Validate required secrets
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID secret" && exit 1)
          test -n "$ASC_KEY_ID" || (echo "Missing ASC_KEY_ID or APP_STORE_CONNECT_API_KEY_ID secret" && exit 1)
          test -n "$ASC_ISSUER_ID" || (echo "Missing ASC_ISSUER_ID or APP_STORE_CONNECT_ISSUER_ID secret" && exit 1)
          if [ -z "$ASC_API_KEY_BASE64" ] && [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "Missing ASC_API_KEY_BASE64, ASC_PRIVATE_KEY_BASE64, or APP_STORE_CONNECT_API_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          key_path="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$HOME/private_keys"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          output = Path.home() / "private_keys" / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          encoded = os.environ.get("ASC_API_KEY_BASE64", "")
          raw = os.environ.get("ASC_PRIVATE_KEY", "")

          if encoded:
              output.write_bytes(base64.b64decode(encoded))
          elif "BEGIN PRIVATE KEY" in raw or "\\n" in raw:
              output.write_text(raw.replace("\\n", "\n"))
          else:
              output.write_bytes(base64.b64decode(raw))
          PY
          chmod 600 "$key_path"

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Archive app
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload IPA to App Store Connect
        run: |
          IPA_PATH="$(find "$EXPORT_PATH" -name "*.ipa" -print -quit)"
          test -n "$IPA_PATH" || (echo "No IPA found in $EXPORT_PATH" && exit 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuoteCloser-ipa
          path: build/QuoteCloserExport/*.ipa
          if-no-files-found: ignore
